name: Build TOTK iOS App (NSP + Update + Mod)

on:
  workflow_dispatch:
    inputs:
      keys_url:
        description: 'Direct Link to prod.keys'
        required: true
      base_game_url:
        description: 'Direct Link to Base Game NSP'
        required: true
      update_url:
        description: 'Direct Link to Update NSP'
        required: true
      mod_url:
        description: 'Direct Link to depths_of_the_kingdom_20_-_public.zip'
        required: false

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space on macOS Runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /Applications/Xcode_*.app || true
          sudo rm -rf /Library/Developer/CoreSimulator || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install macOS Dependencies
        run: |
          brew install opus libvpx xcodegen cmake ninja || true

      - name: Download Files
        run: |
          echo "Downloading prod.keys..."
          curl -L -f --retry 3 "${{ github.event.inputs.keys_url }}" -o prod.keys
          
          echo "Downloading Base Game NSP..."
          curl -L -f --retry 3 "${{ github.event.inputs.base_game_url }}" -o base.nsp
          
          echo "Downloading Update NSP..."
          curl -L -f --retry 3 "${{ github.event.inputs.update_url }}" -o update.nsp
          
          if [ -n "${{ github.event.inputs.mod_url }}" ]; then
            echo "Downloading Mod Archive..."
            curl -L -f --retry 3 "${{ github.event.inputs.mod_url }}" -o mod_input.zip
            unzip -q mod_input.zip -d mod_raw || true
            python3 -c "
            import zipfile, glob, os
            tkcl_files = glob.glob('mod_raw/*.tkcl')
            if tkcl_files:
                with zipfile.ZipFile(tkcl_files[0], 'r') as z:
                    z.extractall('extracted_mod')
            "
          fi

      - name: Build iOS App
        run: |
          BUILD_CMD="python3 build_app.py base.nsp -k prod.keys --update update.nsp --target ios"
          
          if [ -d "extracted_mod" ]; then
            BUILD_CMD="$BUILD_CMD --mod extracted_mod"
          fi
          
          echo "Running build command: $BUILD_CMD"
          eval $BUILD_CMD

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-iOS-App
          path: "*.ipa"
