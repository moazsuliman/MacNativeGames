name: Build TOTK iOS App (Google Drive Inputs)

on:
  workflow_dispatch:
    inputs:
      keys_url:
        description: 'Google Drive Link or File ID for prod.keys'
        required: true
      base_game_url:
        description: 'Google Drive Link or File ID for Base Game NSP'
        required: true
      update_url:
        description: 'Google Drive Link or File ID for Update NSP'
        required: true
      firmware_url:
        description: 'Google Drive Link or File ID for Firmware ZIP'
        required: false
      mod_url:
        description: 'Google Drive Link or File ID for depths_of_the_kingdom_20_-_public.zip'
        required: false

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space on macOS Runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /Applications/Xcode_*.app || true
          sudo rm -rf /Library/Developer/CoreSimulator || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install macOS Dependencies & gdown
        run: |
          brew install opus libvpx xcodegen cmake ninja || true
          pip install --upgrade gdown

      - name: Download Files from Google Drive
        run: |
          python3 -c "
          import gdown

          keys_input = '${{ inputs.keys_url }}'
          base_input = '${{ inputs.base_game_url }}'
          update_input = '${{ inputs.update_url }}'
          firmware_input = '${{ inputs.firmware_url }}'
          mod_input = '${{ inputs.mod_url }}'

          print('Downloading prod.keys...')
          gdown.download(url=keys_input, output='prod.keys', quiet=False, fuzzy=True)

          print('Downloading Base Game NSP...')
          gdown.download(url=base_input, output='base.nsp', quiet=False, fuzzy=True)

          print('Downloading Update NSP...')
          gdown.download(url=update_input, output='update.nsp', quiet=False, fuzzy=True)

          if firmware_input:
              print('Downloading Firmware Archive...')
              gdown.download(url=firmware_input, output='firmware_input.zip', quiet=False, fuzzy=True)

          if mod_input:
              print('Downloading Mod Archive...')
              gdown.download(url=mod_input, output='mod_input.zip', quiet=False, fuzzy=True)
          "

          if [ -f "firmware_input.zip" ]; then
            mkdir -p firmware_dir
            unzip -o firmware_input.zip -d firmware_dir || true
          fi

          if [ -f "mod_input.zip" ]; then
            unzip -q mod_input.zip -d mod_raw || true
            mkdir -p extracted_mod
            find mod_raw -name "*.tkcl" -exec unzip -o {} -d extracted_mod/ \; || true
          fi

      - name: Verify Base Game NSP Size
        run: |
          echo "Checking downloaded NSP file size..."
          ls -lh base.nsp
          SIZE=$(wc -c < base.nsp)
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: base.nsp is smaller than 1 GB ($SIZE bytes)."
            echo "Google Drive link permissions might be set to restricted, or the file ID is invalid."
            echo "First 20 lines of downloaded base.nsp:"
            head -n 20 base.nsp
            exit 1
          fi

      - name: Build iOS App
        run: |
          EXTRA_FLAGS=""
          if [ -d "firmware_dir" ] && [ "$(ls -A firmware_dir)" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --firmware firmware_dir"
          fi
          if [ -d "extracted_mod" ] && [ "$(ls -A extracted_mod)" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --mod extracted_mod"
          fi

          python3 build_app.py base.nsp -k prod.keys --update update.nsp --platform ios -o TearsOfTheKingdom.ipa $EXTRA_FLAGS

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-iOS-App
          path: "*.ipa"
