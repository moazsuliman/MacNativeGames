name: Build TOTK App

on:
  workflow_dispatch:
    inputs:
      keys_url:
        description: 'Google Drive Link for prod.keys'
        required: true
        type: string
      base_game_url:
        description: 'Google Drive Link for Base Game NSP'
        required: true
        type: string
      update_url:
        description: 'Google Drive Link for Update NSP'
        required: true
        type: string
      mod_url:
        description: 'Google Drive Link for Mod ZIP'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize macOS Runner Disk Space
        run: |
          echo "=== Freeing Disk Space ==="
          df -h
          sudo rm -rf /Applications/Xcode*.app || true
          sudo rm -rf /Library/Developer/CommandLineTools || true
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf /opt/homebrew || true
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Reinstall Minimal Homebrew & Python
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          brew install opus libvpx xcodegen cmake ninja python@3.11 || true
          pip3 install --upgrade gdown

      - name: Download Google Drive files
        run: |
          echo "Downloading prod.keys..."
          gdown "${{ inputs.keys_url }}" -O prod.keys
          
          echo "Downloading Base Game NSP..."
          gdown "${{ inputs.base_game_url }}" -O base.nsp
          
          echo "Downloading Update NSP..."
          gdown "${{ inputs.update_url }}" -O update.nsp
          
          if [ -n "${{ inputs.mod_url }}" ]; then
            echo "Downloading Mod..."
            gdown "${{ inputs.mod_url }}" -O mod_input.zip
            unzip -o mod_input.zip -d mod_raw || true
            python3 -c "import zipfile, glob, os
tkcl_files = glob.glob('mod_raw/*.tkcl')
if tkcl_files:
    with zipfile.ZipFile(tkcl_files[0], 'r') as z:
        z.extractall('extracted_mod')
"
          fi

      - name: Build iOS Application
        run: |
          if [ -d "extracted_mod" ]; then
            python3 build_app.py base.nsp -k prod.keys --update update.nsp --mod extracted_mod --target ios
          else
            python3 build_app.py base.nsp -k prod.keys --update update.nsp --target ios
          fi

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: TOTK-iOS-App
          path: "*.ipa"
